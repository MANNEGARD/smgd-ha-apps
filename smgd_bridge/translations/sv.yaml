configuration:
  api_url:
    name: API-adress
    description: Adressen till SMGD Developer Labs API (https://…/functions/v1/api). Den visas under Enheter → Lägg till brygga.
  bridge_name:
    name: Bryggans namn
    description: Namnet som visas i SMGD Developer Lab.
  log_level:
    name: Loggnivå
    description: Hur mycket som skrivs i loggen. Hemligheter skrivs aldrig ut, oavsett nivå.
  allowed_networks:
    name: Tillåtna nätverk
    description: Nätverk (CIDR, t.ex. 192.168.1.0/24) som bryggan får nå enheter i. Tom lista = alla privata nätverk. Adresser utanför listan vägras alltid, även om molnet ber om dem.
  esphome_ota_enabled:
    name: ESP OTA aktiverat
    description: Om bryggan får uppdatera ESPHome-enheter över nätverket.
  max_concurrent_jobs:
    name: Max samtidiga jobb
    description: Hur många enheter bryggan arbetar mot samtidigt (alltid högst ett jobb per enhet).
  download_hosts:
    name: Extra nedladdningsvärdar
    description: Behövs normalt inte. Värdnamn, utöver API:ts egna, som appar och firmware får hämtas från.
  gateway_enabled:
    name: LAN Gateway
    description: >-
      Låter en testsession i SMGD Developer Lab nå tjänster i ditt hemnät genom den här bryggan. Vilka tjänster bestäms i Developer Lab, men gatewayen används bara om den är påslagen här. Av som standard.
  gateway_home_assistant:
    name: Home Assistant via gatewayen
    description: >-
      Hur långt en testsession får gå mot Home Assistant: off = inte alls, read_only = läsa godkända entiteter, interactive = även anropa godkända tjänster. Det som väljs här är ett tak; Developer Lab kan bara vara strängare. Kräver att LAN Gateway är påslagen.
  gateway_internet_enabled:
    name: Internet för testsessioner
    description: >-
      Låter en testsession i SMGD Developer Lab (”Internet som på TV:n”) göra appens internetanrop genom den här bryggan, så att de lämnar ditt hemnät. Bara publika adresser nås den vägen – aldrig något i hemnätet – och varje värd loggas. Av som standard.
  esphome_builder_sync:
    name: Synk med ESPHome Device Builder
    description: >-
      Håller enheterna i ESPHome Device Builder och ESP32-projekten i SMGD Developer Lab lika, åt båda håll. Bryggan läser och skriver då enhetsfilerna i Home Assistants mapp config/esphome. Värdena i secrets.yaml lämnar inte Home Assistant om du inte slår på inställningen nedan, och en fil med lösenord i klartext laddas inte upp. Av som standard.
  esphome_builder_share_secrets:
    name: Dela hemligheter med SMGD Developer Lab
    description: >-
      Låter en administratör i SMGD Developer Lab hämta värdena för de hemligheter (!secret) som en synkad enhet använder, från Device Builders secrets.yaml till projektets hemligheter, så att projektet kan byggas i molnet. Värdena lämnar då ditt hemnät och lagras krypterat. Bara hemligheter som en synkad enhetsfil använder kan hämtas. Kräver att synken ovan är påslagen. Av som standard.
  vci_enabled:
    name: VCI
    description: >-
      Låter en administratör i SMGD Developer Lab ge bryggan VCI-jobb: läsa av en Foxwell VCI som sitter i den här datorns USB-port, skriva serienummer, Bluetooth-namn och MAC-adress, byta läge, uppdatera firmware och skriva nyckel. Bryggan gör hela jobbet lokalt och rapporterar det enheten själv svarat. Det finns ingen terminal den vägen – bara de fasta jobben. Av som standard.
  vci_serial_port:
    name: Serieport för VCI
    description: >-
      Porten som VCI:n sitter på, helst en sökväg under /dev/serial/by-id (annars t.ex. /dev/ttyACM0). Krävs för alla VCI-jobb utom Leta portar: utan den skickar bryggan ingenting till någon port, inte ens när datorn bara har en serieport (den kan vara en Zigbee- eller Z-Wave-sticka). Jobbet Leta portar listar portarna så att du kan välja rätt.

  vci_spp_pin:
    name: PIN-kod för VCI över SPP
    description: >-
      Används bara om VCI:n kräver parkoppling för SPP (klassisk Bluetooth) – bryggan försöker först ansluta utan parkoppling, vilket de flesta VCI:er tillåter. Standard 0000. Används bara för jobb med anslutningen SPP.