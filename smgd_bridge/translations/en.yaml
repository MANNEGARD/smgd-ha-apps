configuration:
  api_url:
    name: API address
    description: The address of the SMGD Developer Lab API (https://…/functions/v1/api). Shown under Devices → Add bridge.
  bridge_name:
    name: Bridge name
    description: The name shown in SMGD Developer Lab.
  log_level:
    name: Log level
    description: How much is written to the log. Secrets are never printed, whatever the level.
  allowed_networks:
    name: Allowed networks
    description: Networks (CIDR, e.g. 192.168.1.0/24) in which the bridge may reach devices. Empty = all private networks. Addresses outside the list are always refused, even when the cloud asks for them.
  esphome_ota_enabled:
    name: ESP OTA enabled
    description: Whether the bridge may update ESPHome devices over the network.
  max_concurrent_jobs:
    name: Max concurrent jobs
    description: How many devices the bridge works on at once (never more than one job per device).
  download_hosts:
    name: Extra download hosts
    description: Normally not needed. Host names, besides the API's own, that apps and firmware may be downloaded from.
  gateway_enabled:
    name: LAN Gateway
    description: >-
      Lets a test session in SMGD Developer Lab reach services in your home network through this bridge. Which services is decided in Developer Lab, but the gateway is only used when it is turned on here. Off by default.
  gateway_home_assistant:
    name: Home Assistant through the gateway
    description: >-
      How far a test session may go with Home Assistant: off = not at all, read_only = read approved entities, interactive = also call approved services. What is chosen here is a ceiling; Developer Lab can only be stricter. Requires LAN Gateway to be on.
  gateway_internet_enabled:
    name: Internet for test sessions
    description: >-
      Lets a test session in SMGD Developer Lab ("internet the way the TV has it") make the app's internet requests through this bridge, so they leave from your home network. Only public addresses are reached this way – never anything inside the home network – and every host is logged. Off by default.
  esphome_builder_sync:
    name: Sync with ESPHome Device Builder
    description: >-
      Keeps the devices in ESPHome Device Builder and the ESP32 projects in SMGD Developer Lab the same, in both directions. The bridge then reads and writes the device files in Home Assistant's config/esphome folder. The values in secrets.yaml do not leave Home Assistant unless you turn on the setting below, and a file with a password written out is not uploaded. Off by default.
  esphome_builder_share_secrets:
    name: Share secrets with SMGD Developer Lab
    description: >-
      Lets an administrator in SMGD Developer Lab fetch the values of the secrets (!secret) a synced device uses, from Device Builder's secrets.yaml into that project's secrets, so the project can be built in the cloud. The values then leave your home network and are stored encrypted. Only secrets a synced device file uses can be fetched. Requires the sync above. Off by default.
  vci_enabled:
    name: VCI
    description: >-
      Lets an administrator in SMGD Developer Lab give the bridge VCI jobs: read a Foxwell VCI plugged into this machine's USB port, write its serial number, Bluetooth name and MAC address, switch mode, update firmware and write the key. The bridge does the whole job locally and reports what the device itself answered. There is no terminal on this path – only the fixed jobs. Off by default.
  vci_serial_port:
    name: Serial port for the VCI
    description: >-
      The port the VCI is on, preferably a path under /dev/serial/by-id (otherwise e.g. /dev/ttyACM0). Required for every VCI job except Find ports: without it the bridge sends nothing to any port, not even when the machine has a single serial port (it may be a Zigbee or Z-Wave stick). The Find ports job lists the ports so that you can pick the right one.

  vci_spp_pin:
    name: PIN for VCI over SPP
    description: >-
      Only used if the VCI requires pairing for SPP (classic Bluetooth) – the bridge first tries to connect without pairing, which most VCIs allow. Default 0000. Only used for jobs with the SPP connection.
  vci_diag_relay:
    name: Diagnostic relay (motor)
    description: >-
      Relays a live diagnostic session between SMGD VCI Engine on the server and the FOX500 over Bluetooth/serial, for the "Diagnostik (motor)" tab in the web app. The engine does all the diagnostic work; the bridge only forwards the raw frames. Off by default and only runs when the engine address below is set. The shared token goes in the Engine token field below.
  vci_engine_ws:
    name: Engine address (WebSocket)
    description: >-
      The engine's bridge WebSocket, e.g. wss://smgd.se/dev/vci-engine-bridge. Required for the diagnostic relay.
  vci_relay_session:
    name: Relay session
    description: >-
      The session the relay joins; must match the one chosen in the "Diagnostik (motor)" tab. Default "default".
  vci_relay_target:
    name: FOX500 Bluetooth target
    description: >-
      The FOX500's name or MAC for classic Bluetooth (SPP). Leave empty to use the serial port above instead.
  vci_engine_token:
    name: Engine token
    description: >-
      The shared token the engine requires (SMGD_VCI_TOKEN in the server's secrets/vci-engine.env). Shown hidden and never written to the log. Without it the engine refuses the bridge.